name: Release Offline Buildpack

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"

      - name: Download and verify pinned dependencies
        run: scripts/cache-dependencies.sh "${{ matrix.architecture }}" "build/cache-${{ matrix.architecture }}"

      - name: Create cached buildpack
        run: scripts/package-cached.sh "${{ matrix.architecture }}" "build/cache-${{ matrix.architecture }}"

      - name: Generate SBOM
        run: scripts/generate-sbom.sh "build/opencode-supply-buildpack-${{ matrix.architecture }}.cdx.json"

      - name: Generate release checksums
        run: |
          cd build
          sha256sum opencode_supply_buildpack-cached-*.zip opencode-supply-buildpack-*.cdx.json \
            > "opencode-supply-buildpack-${{ matrix.architecture }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-supply-buildpack-cached-${{ matrix.architecture }}
          path: |
            build/opencode_supply_buildpack-cached-*.zip
            build/opencode-supply-buildpack-*.cdx.json
            build/opencode-supply-buildpack-*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: opencode-supply-buildpack-cached-*
          merge-multiple: true
          path: release

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
